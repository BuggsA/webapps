<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not here</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1b1a17; --muted: #6b6862; --accent: #b5451b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16150f; --fg: #ece9e0; --muted: #9a968c; --accent: #e8865a; }
  }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    display: grid; place-items: center; min-height: 100svh; padding: 2rem; text-align: center;
  }
  h1 { font-size: 3rem; margin: 0; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0.5rem 0 1.5rem; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Nothing at this path.</p>
  <a href="/">back to the index</a>
</main>
</body>
</html>
