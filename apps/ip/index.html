<!doctype html>
<!--
  ip — "what's my IP".  PHASE 3 of 7.

  Design: ../../docs/ip-art-direction.md  ("Survey")
  Story:  ../../docs/ip-narrative-and-outline.md
  Plan:   ../../docs/ip-build-plan.md

  This file's whole job is that the address is a real element, present in
  the first paint, first in the useful focus order, and that nothing
  optional is ever allowed in front of it. No modal, no consent, no
  tutorial, no onboarding — not now and not in any later phase.

  Everything the canvas draws has a twin here: the plate names the subject,
  #companion carries the facts for assistive technology.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>What's my IP</title>
<meta name="description" content="Your public IP address, immediately, on a page that asks nobody else for it.">
<link rel="canonical" href="https://iphere.app/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060810'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%233b5c85' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%232b4466' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f5a623'/%3E%3C/svg%3E">
<link rel="stylesheet" href="ip.css">
</head>
<body data-state="home">

<!-- The picture. Decorative by contract: it carries no fact that is not
     also in the DOM. -->
<canvas id="field" aria-hidden="true"></canvas>

<!-- THE ANSWER. First in the focus order, and nothing optional moves it. -->
<div id="answer">
  <h1 id="answerLabel">Your public IP address</h1>
  <div id="answerRow">
    <p id="address"><span id="addressText">&mdash;</span></p>
    <button id="copy" type="button" aria-describedby="address">Copy</button>
  </div>
  <!-- USEFUL FIRST (owner, 2026-11-11). The facts people come to a "what's
       my IP" page for, read by our own edge for this visit and not kept.
       A fact the edge did not give is left out, never guessed. -->
  <dl id="facts" hidden>
    <div id="factWhere" hidden><dt>Location, approx.</dt><dd id="wherePlace"></dd><dd class="sub" id="whereSub"></dd></div>
    <div id="factNet" hidden><dt>Internet provider</dt><dd id="netName"></dd><dd class="sub" id="netSub"></dd></div>
    <div id="factKind"><dt>Address type</dt><dd id="kindName"></dd><dd class="sub" id="kindSub"></dd></div>
  </dl>
  <p id="whereNote" hidden></p>
  <p id="answerNote"></p>
  <!-- THE TEASER: one true line about the visitor's own address, from the
       registry the site already ships (js/27-teaser.js). Its space is
       reserved so nothing jumps when it lands. -->
  <p id="teaser" aria-live="polite"></p>
  <!-- The way in. At home it glides out to "You are here"; any input stops
       the glide where it is (js/28-pullback.js). -->
  <div id="explore" hidden>
    <button id="exploreBtn" type="button">Explore the internet around this address</button>
    <p id="exploreHow"></p>
  </div>
</div>

<!-- The subject plate: what the instrument is pointed at. -->
<div id="plate" aria-hidden="true">
  <p id="plateTitle"></p>
  <p id="plateSub"></p>
  <p id="plateNote"></p>
</div>

<!-- What he says. Never in front of the address, never where it can cover the
     plate, and it removes itself. The facts are on the plate and stay there
     whether he is muted or not. -->


<!-- Beat one of the loop: named, reachable things visible from wherever the
     instrument is pointed. Every one of them is a real cell of the field on
     screen, so touching one goes somewhere that exists. -->
<!-- Everything that speaks from below the picture, in one column, so none of
     them has to guess where the others ended. Order is loudest first: what
     was found, then what he says about it, then where you could go next. -->
<div id="below">
  <p id="found" hidden aria-live="polite"></p>
  <p id="guide" hidden></p>
  <p id="sight" hidden></p>
</div>

<!-- The annotation on the visitor's own mark, at the end of its leader. -->
<div id="mark" aria-hidden="true">
  <p id="markAddr"><span id="markFixed" class="fixed"></span><span id="markVary"></span></p>
  <p id="markNote"></p>
</div>

<!-- "You are here": the visitor's own mark, named, at the floor of their
     address family. Only at home. -->
<div id="here" aria-hidden="true">
  <p id="hereTitle">You are here</p>
  <p id="hereNote"></p>
</div>

<!-- Whatever mark the pointer is nearest, named. -->
<div id="tipWrap" aria-hidden="true">
  <p id="tip"><span id="tipFixed" class="fixed"></span><span id="tipVary"></span><span id="tipMine" class="mine"></span></p>
  <p id="tipNote"></p>
</div>

<!-- How to travel. Shown only until the visitor has travelled once,
     then never again. The interaction was unguessable without it. -->
<p id="hint" aria-hidden="true"></p>

<!-- The scale rail: the axis made visible. The only thing on the page that
     says "there is further to go", and it says it without words. -->
<div id="rail" aria-hidden="true">
  <div id="railTrack"></div>
  <div id="railMark"></div>
</div>

<nav id="controls" aria-label="Page">
  <!-- Back appears only once there is somewhere to go back to. Wandering
       needs a way home before it feels safe to wander. -->
  <button id="goBack" type="button" hidden>Back</button>
  <button id="goHome" type="button">Home</button>
  <!-- Off until asked. The press is also the gesture the browser needs
       before it will let anything make a noise, so the two are the same
       event and there is nothing to explain. -->
  <button id="sound" type="button" aria-pressed="false">Sound</button>
  <button id="guideBtn" type="button" aria-pressed="true">Guide on</button>
  <button id="notebook" type="button" aria-expanded="false" aria-controls="notePanel">Notebook</button>
  <button id="about" type="button" aria-expanded="false" aria-controls="aboutPanel">About</button>
</nav>

<!-- The semantic companion: bounded, real, and the keyboard path to
     everything the canvas shows. Visually hidden until focused. -->
<section id="companion" aria-label="This view">
  <h2 id="companionState">Home</h2>
  <p id="companionSummary"></p>
  <div id="companionFacts"></div>
</section>

<p id="live" role="status" aria-live="polite"></p>

<div id="aboutPanel" hidden>
  <div id="aboutInner">
    <button id="aboutClose" type="button">Close</button>
    <div id="aboutBody"></div>
  </div>
</div>

<!-- The logbook. Behind a control, so it can be ignored forever by anyone
     who does not care, and sitting there for anyone who does. -->
<div id="notePanel" hidden>
  <div id="noteInner">
    <button id="noteClose" type="button">Close</button>
    <div id="noteBody"></div>
  </div>
</div>

<script src="telemetry.js"></script>
<!-- The app, in load order: classic scripts sharing one global scope. Most
     of them only declare functions, which can live in any file; order
     matters for the few statements that run at load (the landmark list in
     03, and 29-boot, which must be last). What each one holds: MAP.md. -->
<script src="js/00-config.js"></script>
<script src="js/01-address.js"></script>
<script src="js/02-curve.js"></script>
<script src="js/03-landmarks.js"></script>
<script src="js/04-ladder.js"></script>
<script src="js/05-state.js"></script>
<script src="js/06-camera.js"></script>
<script src="js/07-scene.js"></script>
<script src="js/08-gl.js"></script>
<script src="js/09-c2d.js"></script>
<script src="js/10-content.js"></script>
<script src="js/11-notebook.js"></script>
<script src="js/12-celebration.js"></script>
<script src="js/13-guide.js"></script>
<script src="js/14-sound.js"></script>
<script src="js/15-renderer.js"></script>
<script src="js/16-axis.js"></script>
<script src="js/17-pick.js"></script>
<script src="js/18-travel.js"></script>
<script src="js/19-input.js"></script>
<script src="js/20-network.js"></script>
<script src="js/21-registry.js"></script>
<script src="js/22-query.js"></script>
<script src="js/23-words.js"></script>
<script src="js/24-view.js"></script>
<script src="js/25-answer.js"></script>
<script src="js/26-wiring.js"></script>
<script src="js/27-teaser.js"></script>
<script src="js/28-pullback.js"></script>
<script src="js/29-boot.js"></script>
</body>
</html>
