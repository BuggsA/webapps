<!doctype html>
<!--
  The 404 for apps/ip on Cloudflare Pages (the only host, 2026-11-11).

  It exists for two reasons. Without a top-level 404.html, Pages assumes a
  single-page app and answers EVERY unknown path with index.html and a 200,
  so /robots.txt, /sitemap.xml and any mistyped URL all looked like the home
  page - which search engines count as duplicate pages. And a wrong turn
  should still look like this instrument, not like a stock error page.

  Same material as the app: the ground, Archivo, cream for what you are
  told, cold blue for structure. No border-radius, no box-shadow. Paths are
  absolute because this is served at whatever depth the wrong URL had.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Nothing here — what’s my IP</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'Archivo';
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: swap;
    src: url('/fonts/archivo-latin-var.woff2') format('woff2');
  }
  :root { --ground: #05070d; --cream: #f2ede3; --cold-2: #8fa9c9; --cold-3: #5c7fa8; }
  html, body { margin: 0; height: 100%; background: var(--ground); }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font-family: 'Archivo', sans-serif; text-align: center; color: var(--cold-2);
  }
  h1 {
    margin: 0; color: var(--cream);
    font-size: clamp(28px, 6vw, 64px); font-weight: 260; font-stretch: 108%;
    letter-spacing: -.005em;
  }
  p { margin: 1em auto 1.6em; font-size: 15px; line-height: 1.55; max-width: 40ch; }
  a {
    color: var(--cream); text-decoration: none; font-size: 14px; letter-spacing: .06em;
    border-bottom: 1px solid var(--cold-3); padding-bottom: 4px;
  }
  a:hover { border-color: var(--cream); }
  a:focus-visible { outline: 1px solid #f5a623; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Nothing is announced here</h1>
  <p>There is no page at this address. Your own address is on the front page, where it always is.</p>
  <a href="/">Show me my IP address</a>
</main>
</body>
</html>
