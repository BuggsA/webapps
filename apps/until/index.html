<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Until</title>
<meta name="description" content="How long until something happens. A calm, cinematic countdown.">
<meta name="theme-color" content="#16150f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316150f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f4f0e2'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8865a' stroke-opacity='0.5' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spacegrotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="until.css">
</head>
<body>
<canvas id="viz" aria-hidden="true"></canvas>
<canvas id="glviz" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<main id="setup" class="setup">
  <div class="setup-inner">
    <h1>How long until&hellip;</h1>
    <form id="form" class="composer" novalidate>
      <input id="name" class="c-name" type="text" value="Dinner"
             aria-label="Event name" autocomplete="off" spellcheck="false"
             placeholder="Event name">
      <div class="c-when">
        <input id="date" type="date" aria-label="Date">
        <input id="time" type="time" aria-label="Time">
      </div>
      <button id="go" class="btn" type="submit">See the time <span class="arrow" aria-hidden="true">&rarr;</span></button>
    </form>
    <p class="shortcuts" id="shortcuts">
      <button type="button" data-s="today">End of today</button><span aria-hidden="true">&middot;</span><button type="button" data-s="tomorrow">Tomorrow morning</button><span aria-hidden="true">&middot;</span><button type="button" data-s="weekend">This weekend</button><span aria-hidden="true">&middot;</span><button type="button" data-s="newyear">New Year</button>
    </p>
  </div>
</main>

<section id="result" class="result" hidden>
  <button id="back" class="back" type="button">&larr;&nbsp;new</button>

  <div class="readout">
    <div class="event-name" id="ev-name">Dinner</div>
    <div class="big-time" id="ev-time">
      <span class="affix pre">That was</span>
      <span class="value">&mdash;</span>
      <span class="affix post">ago</span>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="modes" id="modes" role="group" aria-label="Visualization mode">
      <button type="button" data-m="lights" class="is-active">lights</button>
      <button type="button" data-m="orbit">orbit</button>
      <button type="button" data-m="horizon">horizon</button>
    </div>
    <span class="unit-note" id="unit-note"></span>
    <button id="keep" class="keep" type="button">Keep this open</button>
  </div>

  <button id="exit" class="exit" type="button" hidden>Exit ambient</button>
  <p class="sr" id="sr" aria-live="polite" aria-atomic="true"></p>
</section>

<script src="until.js"></script>
</body>
</html>
