<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight</title>
<meta name="description" content="Tonight's sky where you are — a horizon panorama of twilight, the moon and the planets, computed in your browser.">
<meta name="theme-color" content="#0b1020">
<meta name="app" content="tonight">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1020'/%3E%3Cpath d='M21 6a10 10 0 1 0 0 20 8 8 0 0 1 0-20z' fill='%23f2efe6'/%3E%3Ccircle cx='9' cy='9' r='1.1' fill='%23f2efe6'/%3E%3Ccircle cx='24' cy='23' r='1' fill='%23f2efe6'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tonight.css">
</head>
<body>
<canvas id="sky"></canvas>

<!-- Place name, written into the field, lower-left -->
<div id="placard" class="placard" hidden>
  <span class="placard-place"></span>
  <span class="placard-sub"></span>
</div>

<!-- Object card — a quiet overlay tethered to a tapped object -->
<div id="card" class="card" hidden aria-live="polite">
  <span class="card-name"></span>
  <span class="card-pos"></span>
  <span class="card-rise"></span>
  <span class="card-advice"></span>
</div>

<!-- Location: a prompt written into the field — not a card -->
<form id="locate" class="locate" autocomplete="off" hidden>
  <h1>Tonight</h1>
  <p>The sky above you, right now. Where are you tonight?
     Your place stays on this device.</p>
  <input id="place-input" class="field" type="text" inputmode="search"
         placeholder="a town, or a city" aria-label="Place name" spellcheck="false">
  <ul id="place-results" class="place-results" role="listbox" hidden></ul>
  <div class="locate-actions">
    <button class="word" type="submit">Search</button>
    <button class="word" type="button" id="use-device">Use my location</button>
  </div>
  <p id="locate-msg" class="locate-msg" role="status" hidden></p>
</form>

<!-- Time: a caption line on the field -->
<div id="controls" class="controls" hidden>
  <button id="btn-now" class="word" type="button">Now</button>
  <button id="btn-play" class="word" type="button" aria-pressed="false">Play</button>
  <input id="scrub" class="scrub" type="range" min="0" max="1000" step="1" value="0"
         aria-label="Time from dusk to dawn">
  <output id="clock" class="clock" for="scrub"></output>
  <button id="btn-clouds" class="ctl-where" type="button" aria-pressed="true"
          aria-label="Toggle the cloud veil" hidden>&#9729;</button>
  <button id="btn-where" class="ctl-where" type="button" aria-label="Change location">&#8853;</button>
</div>

<script src="telemetry.js"></script>
<script src="lib/astronomy.js"></script>
<script src="tonight.js"></script>
</body>
</html>
